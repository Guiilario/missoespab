<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A33E1" />
  <title>Admin — Missões</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-top"></div>

  <main class="app-main">
    <h1 class="page-title font-display">Painel administrativo</h1>

    <!-- ---------- Criar usuário ---------- -->
    <div class="card">
      <h2 class="admin-card-title font-display">Criar usuário</h2>
      <form id="create-user-form">
        <div class="field">
          <label for="new-name">Nome</label>
          <input type="text" id="new-name" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="new-username">Usuário</label>
          <input type="text" id="new-username" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="new-email">E-mail</label>
          <input type="email" id="new-email" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="new-password">Senha</label>
          <input type="text" id="new-password" required minlength="6" autocomplete="off" />
        </div>
        <p class="form-error" id="create-user-error" hidden></p>
        <p class="form-success" id="create-user-success" hidden></p>
        <button type="submit" class="btn-primary" id="create-user-btn">Criar usuário</button>
      </form>
    </div>

    <!-- ---------- Lista de usuários ---------- -->
    <div class="card section-gap">
      <h2 class="admin-card-title font-display">Usuários</h2>
      <div id="users-list">
        <p class="missions-loading">Carregando...</p>
      </div>
    </div>

    <!-- ---------- Missão do dia ---------- -->
    <div class="card section-gap">
      <h2 class="admin-card-title font-display">Missão do dia</h2>

      <div class="field">
        <label for="assignment-date">Data</label>
        <input type="date" id="assignment-date" />
      </div>

      <p class="admin-subtitle">Atribuir missão já existente</p>
      <div class="admin-inline-form">
        <select id="existing-mission-select"></select>
        <button type="button" class="btn-secondary" id="assign-existing-btn">Atribuir</button>
      </div>

      <p class="admin-subtitle">Ou criar uma missão nova</p>
      <form id="create-mission-form">
        <div class="field">
          <label for="mission-title">Título</label>
          <input type="text" id="mission-title" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="mission-description">Descrição</label>
          <input type="text" id="mission-description" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="mission-xp">XP</label>
          <input type="number" id="mission-xp" required min="1" value="150" />
        </div>
        <div class="field">
          <label for="mission-difficulty">Dificuldade</label>
          <select id="mission-difficulty">
            <option value="easy">Fácil</option>
            <option value="medium">Média</option>
            <option value="hard">Difícil</option>
          </select>
        </div>
        <p class="form-error" id="create-mission-error" hidden></p>
        <p class="form-success" id="create-mission-success" hidden></p>
        <button type="submit" class="btn-primary" id="create-mission-btn">
          Criar e atribuir a essa data
        </button>
      </form>

      <p class="admin-subtitle">Missões atribuídas nessa data</p>
      <div id="assigned-missions-list">
        <p class="missions-loading">Selecione uma data.</p>
      </div>
    </div>
  </main>

  <div id="nav-bottom"></div>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/pages/admin.js"></script>
</body>
</html>
