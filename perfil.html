<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A33E1" />
  <title>Perfil — Missões</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-top"></div>

  <main class="app-main profile-card">
    <div style="text-align:center; padding-bottom: 1.5rem;">
      <div style="font-family: 'Arial Black', Impact, sans-serif; font-size: 32px; font-weight: 900; letter-spacing: -2px; display: inline-block;">
        <span style="color: #39FF14;">APP</span><span style="color: #ffffff; font-family: 'Segoe Script', cursive; font-size: 26px; font-weight: 700; margin-left: 2px;">ab</span>
      </div>
    </div>
    <div class="card profile-card">
      <div class="profile-avatar">
        <img src="assets/avatar-default.svg" alt="" />
      </div>

      <h1 class="profile-name font-display" id="profile-name">Carregando...</h1>
      <p class="profile-username" id="profile-username">@usuario</p>

      <div class="profile-xp-block">
        <div class="profile-xp-row">
          <span class="lvl font-display" id="profile-level">Nível 01</span>
          <span class="amount" id="profile-xp-amount">0/0 XP</span>
        </div>
        <div class="progress-track brand-track" style="margin-top: 0.375rem;">
          <div class="progress-fill brand-fill" id="profile-progress-fill" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <p class="value font-display" id="stat-xp">0</p>
        <p class="label">XP total</p>
      </div>
      <div class="stat-card">
        <p class="value font-display" id="stat-missions">0</p>
        <p class="label">Missões</p>
      </div>
      <div class="stat-card">
        <p class="value font-display" id="stat-streak">0d</p>
        <p class="label">Sequência</p>
      </div>
    </div>

    <div class="card days-card">
      <p class="label">Dias completados</p>
      <p class="value font-display" id="stat-days">0</p>
    </div>

    <div class="card section-gap" id="referrals-card">
      <h2 class="font-display" style="font-size:0.875rem;font-weight:600;margin:0;">
        Voluntários que você indicou
      </h2>
      <div id="referrals-list" style="margin-top:0.75rem;">
        <p class="missions-loading" style="padding:0.5rem 0;">Carregando...</p>
      </div>
    </div>

    <div class="profile-actions">
      <p class="profile-msg" id="profile-msg" hidden></p>

      <div id="admin-link-slot"></div>

      <button class="btn-danger" id="logout-btn">Sair</button>
    </div>
  </main>

  <div id="nav-bottom"></div>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
