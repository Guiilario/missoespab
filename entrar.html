<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A33E1" />
  <title>Entrar — Missões</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-screen">
    <div class="auth-box">
      <div class="auth-header">
        <div class="auth-logo font-display" style="width:auto;height:auto;background:none;border-radius:0;">
          <div style="font-family: 'Arial Black', Impact, sans-serif; font-size: 36px; font-weight: 900; letter-spacing: -2px; display: inline-block;">
            <span style="color: #39FF14;">APP</span><span style="color: #ffffff; font-family: 'Segoe Script', cursive; font-size: 28px; font-weight: 700; margin-left: 2px;">ab</span>
          </div>
        </div>
        <h1 class="font-display">Entrar</h1>
        <p>Continue de onde você parou.</p>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="email">E-mail ou usuário</label>
          <input type="text" id="email" required placeholder="voce@email.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
        </div>

        <p class="form-error" id="error-msg" hidden></p>
        <p class="form-error" id="deactivated-msg" hidden>Sua conta foi desativada. Fale com o administrador.</p>

        <button type="submit" class="btn-primary" id="submit-btn">Entrar</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
